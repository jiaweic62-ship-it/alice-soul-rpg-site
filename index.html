refreshStartButtons();
const gameFiles=['memory-labyrinth/params','memory-labyrinth/model','memory-labyrinth/engine','systems/numbers','systems/effects','data/portraits','data/collection','systems/chest-random','systems/collection','systems/battle','systems/dungeon-spawner','systems/dungeon-events','systems/collection-battle','systems/exploration','systems/dialogue','ui/portraits','memory-labyrinth/ui','telemetry-config','telemetry-journal','telemetry','game'].map(f=>f+'.js');
const chapter2File='data/chapter2-test-start.js';
const cacheState=document.getElementById('assetCacheStatus'),saveImages=document.getElementById('cacheImages'),cancelImages=document.getElementById('cacheImagesCancel');
GameAssets.subscribe(s=>{const mb=n=>(n/1048576).toFixed(1);cacheState.textContent=(s.running?'保存中 · ':'画像を端末に保存 · ')+s.saved+' / '+s.total+'枚（'+mb(s.bytes)+' / '+mb(s.totalBytes)+' MB）'+(s.issue?' · '+s.issue:'');saveImages.disabled=s.running||s.saved===s.total;saveImages.textContent=s.saved===s.total?'すべて保存済み':'画像をまとめて保存（約'+mb(s.totalBytes)+' MB）';cancelImages.hidden=!s.running;});
saveImages.onclick=()=>GameAssets.saveImages();cancelImages.onclick=()=>GameAssets.cancel();
// start: 'continue' | 'new' | 'chapter2'. A new start keeps a backup copy of what the slot held before.
async function launchGame(slot=1,start='continue'){if(starting)return;starting=true;refreshStartButtons();const key=slotKey(slot),fresh=start!=='continue',files=start==='chapter2'||start==='chapter2max'?[chapter2File,...gameFiles]:gameFiles;let executing=false,backingUp=false;const progress=document.getElementById('loadProgress'),note=document.getElementById('titleIdleNote');progress.hidden=false;progress.max=files.length;progress.value=0;note.textContent='ゲームデータを読み込み中 · 0 / '+files.length;try{
 GameAssets.persist();let done=0;const texts=await Promise.all(files.map(path=>GameAssets.text(path).then(text=>{progress.value=++done;note.textContent='ゲームデータを読み込み中 · '+done+' / '+files.length;return text;})));
 if(fresh){backingUp=true;const old=localStorage.getItem(key);if(old){const snapshot=JSON.stringify({save:old,ui:localStorage.getItem(key+'-ui')});const prefix=key+'-before-new-game-'+Date.now();let k=prefix,n=0;while(localStorage.getItem(k)!==null)k=prefix+'-'+(++n);localStorage.setItem(k,snapshot);if(localStorage.getItem(k)!==snapshot)throw Error('restart backup unavailable');}globalThis.GAME_START_NEW=key;if(start==='chapter2'||start==='chapter2max')globalThis.GAME_START_CHAPTER2=key;if(start==='chapter2max')globalThis.GAME_START_MAX=key;backingUp=false;}
 globalThis.GAME_SAVE_KEY=key;
 executing=true;for(let i=0;i<files.length;i++)if(!loadedAssets.has(files[i])){await GameAssets.execute(texts[i],files[i]);loadedAssets.add(files[i]);}
 note.textContent='出会える人物の画像を準備中';await globalThis.GamePresentationReady;
 document.getElementById('startScreen').remove();document.getElementById('gameRoot').hidden=false;document.body.classList.remove('booting');
}catch(e){console.error(e);progress.hidden=true;if(executing||e.message?.includes('changed')){note.textContent='読み込みを完了できませんでした。ページを再読み込みしてください。';startButton.textContent='再読み込み';startButton.disabled=false;startButton.onclick=()=>location.reload();newButton.disabled=true;if(chapter2Button)chapter2Button.disabled=true;if(chapter2MaxButton)chapter2MaxButton.disabled=true;}else{starting=false;refreshStartButtons();note.textContent=backingUp?'記録をバックアップできないため、最初から開始できません。元の記録は変更していません。':'読み込みに失敗しました。通信を確認してもう一度お試しください。';}}}
function ask(title,text,confirmText,action,danger=false){restartTitle.textContent=title;restartText.textContent=text;restartConfirm.textContent=confirmText;restartConfirm.classList.toggle('danger',danger);confirmAction=action;restartDialog.showModal();restartCancel.focus();}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
const LEADS={continue:['続きから','続きを遊ぶ記録を選んでください。'],new:['はじめから','新しい冒険を記録する場所を選んでください。'],chapter2:['第二章から始める','第二章のはじめから遊びます。記録する場所を選んでください。']};
function renderSlots(){slotTitle.textContent=LEADS[slotMode][0];slotLead.textContent=LEADS[slotMode][1];slotList.replaceChildren();slotPicks=[];
 for(const n of slots){const text=readSlot(n),info=slotSummary(text),row=el('div','save-slot'+(info?'':' empty')),pick=el('button','slot-pick');pick.type='button';
  const head=el('span','slot-top');head.append(el('span','slot-no','記録 '+n),el('span','slot-chapter',info?info.broken?'読み込めない記録':info.chapter:'空き'));pick.append(head);
  if(info&&!info.broken){pick.append(el('span','slot-detail','取り込んだ人物 '+info.owned+'人'+(info.play?' · プレイ時間 '+info.play:'')));if(info.date)pick.append(el('span','slot-date',info.date));}
  else if(!info)pick.append(el('span','slot-detail',slotMode==='continue'?'記録がありません':'ここに記録します'));
  pick.disabled=starting||slotMode==='continue'&&!info;pick.setAttribute('aria-label','記録 '+n+'：'+(info?info.broken?'読み込めない記録':[info.chapter,'取り込んだ人物 '+info.owned+'人',info.play&&'プレイ時間 '+info.play,info.date].filter(Boolean).join('、'):'空き'));
  pick.onclick=()=>pickSlot(n);slotPicks.push(pick);row.append(pick);
  if(info){const del=el('button','slot-delete','削除');del.type='button';del.disabled=starting;del.setAttribute('aria-label','記録 '+n+'を削除');del.onclick=()=>ask('「記録 '+n+'」を削除しますか？','削除した記録は元に戻せません。','削除する',()=>{try{localStorage.removeItem(slotKey(n));localStorage.removeItem(slotKey(n)+'-ui');}catch{}refreshStartButtons();if(slotMode==='continue'&&!anySave())slotDialog.close();else renderSlots();},true);row.append(del);}
  slotList.append(row);}}
function openSlots(mode){if(starting)return;slotMode=mode;renderSlots();slotDialog.showModal();(slotPicks.find(b=>!b.disabled)||slotBack).focus();}
function pickSlot(n){if(starting)return;const has=!!readSlot(n);
 if(slotMode==='continue'){if(!has)return;slotDialog.close();return launchGame(n,'continue');}
 const go=()=>{slotDialog.close();return launchGame(n,slotMode);};
 if(!has)return go();
 ask('「記録 '+n+'」に上書きしますか？',slotMode==='chapter2'?'今の記録は消えて、第二章のはじめから始まります。':'今の記録は消えて、新しい冒険が始まります。','上書きする',go);}
startButton.onclick=()=>{if(!startButton.disabled)return openSlots('continue');};
newButton.onclick=()=>openSlots('new');
if(chapter2Button)chapter2Button.onclick=()=>openSlots('chapter2');
// Strongest chapter 2 test start always goes to slot 3 (user 2026-11-03).
const MAX_SLOT=3;if(chapter2MaxButton)chapter2MaxButton.onclick=()=>{if(starting)return;const go=()=>launchGame(MAX_SLOT,'chapter2max');if(!readSlot(MAX_SLOT))return go();ask('「記録 '+MAX_SLOT+'」に上書きしますか？','今の記録は消えて、第二章のはじめから、攻撃力と生命力が最大の状態で始まります。','上書きする',go);};
slotBack.onclick=()=>slotDialog.close();
restartCancel.onclick=()=>{confirmAction=null;restartDialog.close();};
restartConfirm.onclick=()=>{if(starting)return;const action=confirmAction;confirmAction=null;restartDialog.close();return action?.();};

</script></body></html>
