<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alice Soul · 试玩统计</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10191f;color:#e2e7df}body{max-width:1200px;margin:auto;padding:28px 20px}h1{font-size:27px;margin-bottom:8px}h2{font-size:18px}p,small{color:#aebdbb;line-height:1.7}button,select,input{font:inherit;background:#24353c;color:inherit;border:1px solid #56696b;border-radius:7px;padding:9px;margin:4px}button{cursor:pointer}button:hover{border-color:#d0bc8b}a{color:#dfc99b}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card,section{background:#19272e;border:1px solid #34494f;border-radius:12px;padding:18px;margin-bottom:18px}.card b{display:block;font-size:27px;color:#dfc99b}.card small{display:block;margin-top:8px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #33464c;vertical-align:top;overflow-wrap:anywhere}th{color:#c9bb98}code{font-size:12px;overflow-wrap:anywhere}#status{min-height:24px;color:#d5c492}.empty{padding:24px;text-align:center}.timeline td:last-child{max-width:600px}.warning{color:#e4b68c}@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}body{padding:18px 10px}h1{font-size:23px}}
</style>
<h1>Alice Soul · 试玩统计</h1>
<p id="modeNote">本地模式只读取当前网站、当前浏览器的记录。连接云端后可查看朋友自动上传的试玩记录，需管理员口令。</p>
<div class="tools"><label>范围 <select id="days"><option value="1">最近24小时</option><option value="7" selected>最近7天</option><option value="30">最近30天</option><option value="90">最近90天</option></select></label><label>版本 <select id="build"><option value="">所有版本</option></select></label><label>试玩场次 <select id="session"><option value="">全部</option></select></label><button id="refresh">刷新</button><button id="export">导出全部统计</button><label><button id="importButton">导入统计</button><input id="import" type="file" accept=".json" hidden></label><button id="clear">删除本浏览器统计</button></div>
<p id="status" role="status"></p><main id="report"></main>
<details><summary>可选：连接服务端统计</summary><p>网页单人试玩无需此项。部署接收服务后，可用管理员口令查看汇总；口令仅保存在当前页面内存。</p><label>服务地址 <input id="server" placeholder="https://stats.example.com" type="url"></label><label>管理员口令 <input id="token" type="password" autocomplete="off"></label><button id="connect">查看服务端</button><button id="local">返回本地</button></details>
<script src="telemetry-config.js"></script><script src="telemetry-journal.js"></script><script src="monitor.js"></script></html>
